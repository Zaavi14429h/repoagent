[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "repoagent"
version = "0.1.0"
description = "Agentic software engineering from natural-language requirement to reviewed pull request"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "RepoAgent Team" }]
dependencies = [
  "a2a-sdk==1.2.3",
  "crewai==1.15.30",
  "fastapi>=0.115.0",
  "google-adk==1.14.1",
  "httpx>=0.27.0",
  "langfuse==5.0.4",
  "mcp==1.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-dotenv>=1.0.1",
  "streamlit>=1.40.0",
  "typer>=0.12.5",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]

[project.scripts]
repoagent = "repoagent.cli:app"
repoagent-api = "repoagent.api:main"
repoagent-adk = "repoagent.adk_validation.service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repoagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/repoagent/cli.py" = ["B008"]

